#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
cache = true

[[session]]
name = "HR SignUp - Internal - main"
path = "~/work/HR-SignUp/main"
windows = [ "Code", "Docker", "DB", "AI" ]

[[session]]
name = "HR SignUp - Internal - work"
path = "~/work/HR-SignUp/work"
windows = [ "Code", "Docker", "DB", "AI" ]

[[session]]
name = "HR SignUp - Internal - review"
path = "~/work/HR-SignUp/review"
windows = [ "Code", "Docker", "DB", "AI" ]

[[session]]
name = "HR SignUp - External"
path = "~/work/HR-SignUp-External/"
windows = [ "Code", "Docker", "DB", "AI" ]

[[window]]
name = "Code"
startup_script = "~/.config/sesh/scripts/dev"

[[window]]
name = "Docker"
startup_script = "docker compose up -d"

[[window]]
name = "DB"
startup_script = "~/.config/sesh/scripts/db"

[[window]]
name = "AI"
startup_script = "pi"
